name: Deploy Website

on:
  push:
    branches:
      - master
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp -R web/. site/

      - name: Upload artifact
        id: upload-pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Remove stale Pages artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOADED_ARTIFACT_ID: ${{ steps.upload-pages.outputs.artifact_id }}
        run: |
          set -euo pipefail
          artifact_ids="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq '.artifacts[] | select(.name == "github-pages") | .id'
          )"

          for artifact_id in $artifact_ids; do
            if [[ "$artifact_id" == "$UPLOADED_ARTIFACT_ID" ]]; then
              continue
            fi
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
